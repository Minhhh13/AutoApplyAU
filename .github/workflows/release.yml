name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test distribution helpers
        run: python -m unittest discover -s tests -v
      - name: Test skill helpers
        run: python -m unittest discover -s auto-au-applications/tests -v
      - name: Build portable skill
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_skill.py --version "$RELEASE_TAG" --output dist/auto-au-applications.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "dist/auto-au-applications.zip" --verify-tag --title "AutoApply AU $RELEASE_TAG" --generate-notes
